<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .error-container {
            text-align: center;
            padding: 60px 20px;
        }
        .error-code {
            font-size: 5rem;
            color: #e74c3c;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .error-message {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 30px;
        }
        .error-container a {
            display: inline-block;
            padding: 12px 30px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .error-container a:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>☁️ Cloud Architecture Patterns</h1>
        </header>
        <main>
            <div class="error-container">
                <div class="error-code">404</div>
                <div class="error-message">Page Not Found</div>
                <p>The page you're looking for doesn't exist on this S3 bucket.</p>
                <p style="margin-top: 20px; color: #666;">
                    This error document is served by S3's static website hosting when a file doesn't exist.
                </p>
                <a href="/">← Back to Home</a>
            </div>
        </main>
    </div>
</body>
</html>
