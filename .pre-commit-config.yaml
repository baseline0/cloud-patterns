default_stages:
  - pre-commit
default_install_hook_types:
  - pre-commit
  - pre-push
repos:
  - repo: local
    hooks:
      - id: repo-root-pattern
        name: "[P1] Enforce REPO_ROOT pattern (no .parent outside constants.py)"
        entry: bash ../fleet-base/scripts/check-repo-root-pattern.sh
        language: system
        pass_filenames: false
        files: '\.py$'
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: check-argparse-prohibition
        name: "[P1] No argparse: CLIs use Typer"
        entry: bash ../fleet-base/scripts/check-argparse-prohibition.sh
        language: system
        pass_filenames: false
        files: '\.py$'
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: just-test-unit
        name: '[P0] Pre-push: just test-unit (unit tests)'
        entry: env -u VIRTUAL_ENV just test-unit
        language: system
        pass_filenames: false
        always_run: true
        stages:
          - pre-push
