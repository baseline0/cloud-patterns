default_stages:
  - pre-commit
default_install_hook_types:
  - pre-commit
  - pre-push
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
        - id: trailing-whitespace
        - id: end-of-file-fixer
        - id: check-merge-conflict
        - id: check-added-large-files
          args: [--maxkb=1000]
        - id: check-yaml
          args: [--unsafe]
        - id: detect-private-key
  - repo: local
    hooks:
      - id: repo-root-pattern
        name: "[P1] Enforce REPO_ROOT pattern (no .parent outside constants.py)"
        entry: fleet hook --name check-repo-root-pattern
        language: system
        pass_filenames: false
        files: '\.py$'
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: check-argparse-prohibition
        name: "[P1] No argparse: CLIs use Typer"
        entry: fleet hook --name check-argparse-prohibition
        language: system
        pass_filenames: false
        files: '\.py$'
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: just-test-unit
        name: '[P0] Pre-push: just test-unit (unit tests)'
        entry: env -u VIRTUAL_ENV just test-unit
        language: system
        pass_filenames: false
        always_run: true
        stages:
          - pre-push
  - repo: local
    hooks:
      - id: fleet-clean-vendored
        name: "[P1] just/fleet-clean.just matches fleet-base (hand edits fail)"
        entry: just check-fleet-clean
        language: system
        pass_filenames: false
        files: '^(just/fleet-clean\.just|justfile)$'
        stages: [pre-commit]
